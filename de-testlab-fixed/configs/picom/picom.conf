# picom 13 — blur, shadows, rounded corners for AwesomeWM
backend = "glx";
vsync = true;
use-damage = true;
dithered-present = false;

corner-radius = 10;
rounded-corners-exclude = [ "window_type = 'dock'", "class_g = 'Awesome'" ];

shadow = true;
shadow-radius = 20;
shadow-opacity = 0.55;
shadow-offset-x = -20;
shadow-offset-y = -14;
shadow-color = "#0b0b12";
shadow-exclude = [ "class_g = 'firefox' && argb", "window_type = 'dropdown_menu'", "window_type = 'popup_menu'" ];

blur: {
  method = "dual_kawase";
  strength = 6;
  background = true;
  background-frame = false;
  background-fixed = false;
}
blur-background-exclude = [ "window_type = 'desktop'", "class_g = 'firefox'", "class_g = 'mpv'" ];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

inactive-opacity = 0.96;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
opacity-rule = [
  "94:class_g = 'kitty' && focused",
  "90:class_g = 'kitty' && !focused",
  "100:class_g = 'firefox'",
  "100:class_g = 'mpv'",
  "85:window_type = 'dock'"
];

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
unredir-if-possible = false;

wintypes: {
  tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; };
  dock = { shadow = true; blur-background = true; };
  popup_menu = { opacity = 0.96; shadow = true; };
  dropdown_menu = { opacity = 0.96; shadow = true; };
  notification = { shadow = true; blur-background = true; };
};
