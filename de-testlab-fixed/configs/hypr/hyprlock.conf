# Catppuccin Mocha lock screen
general {
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    path = @WALLPAPER@
    blur_passes = 3
    blur_size = 8
    brightness = 0.72
    contrast = 0.9
    vibrancy = 0.2
}

# big clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 118
    font_family = JetBrains Mono ExtraBold
    color = rgba(cdd6f4ff)
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0b0b12aa)
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 22
    font_family = Noto Sans
    color = rgba(a6adc8ff)
    position = 0, 90
    halign = center
    valign = center
}

# avatar-ish accent ring + input
input-field {
    monitor =
    size = 320, 58
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(89b4faff)
    inner_color = rgba(1e1e2ecc)
    font_color = rgba(cdd6f4ff)
    font_family = JetBrains Mono
    fade_on_empty = false
    rounding = 18
    placeholder_text = <span foreground="##a6adc8">   Enter password</span>
    fail_text = <span foreground="##f38ba8">  $FAIL ($ATTEMPTS)</span>
    check_color = rgba(f9e2afff)
    fail_color = rgba(f38ba8ff)
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text =    $USER@$(hostname)
    font_size = 14
    font_family = JetBrains Mono
    color = rgba(6c7086ff)
    position = 0, -150
    halign = center
    valign = center
}
