# ─────────────────────────────────────────────────────────────
#  Hyprland — Catppuccin Mocha  (generated, safe to edit)
#  docs: https://wiki.hypr.land/
# ─────────────────────────────────────────────────────────────

monitor = , preferred, auto, 1

### variables
$mod       = SUPER
$term      = kitty
$menu      = wofi --show drun
$files     = de-files
$power     = de-powermenu
$shot      = de-screenshot

### palette
$base      = rgb(1e1e2e)
$surface   = rgb(313244)
$blue      = rgb(89b4fa)
$mauve     = rgb(cba6f7)
$overlay   = rgb(6c7086)

### environment
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

### autostart
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = wl-paste --watch cliphist store
exec-once = /usr/libexec/polkit-kde-authentication-agent-1
# one secret store for every session, so saved passwords survive a desktop switch
exec-once = gnome-keyring-daemon --start --components=secrets,ssh
exec-once = nm-applet --indicator
exec-once = hyprctl setcursor Adwaita 24
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
exec-once = gsettings set org.gnome.desktop.interface font-name 'Noto Sans 10'

### input
input {
    kb_layout = @KBLAYOUT@
    kb_model = @KBMODEL@
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }
}

gesture = 3, horizontal, workspace

### look
general {
    gaps_in = 5
    gaps_out = 14
    border_size = 2
    col.active_border = $blue $mauve 45deg
    col.inactive_border = rgba(31324480)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.95
    dim_inactive = true
    dim_strength = 0.06

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        noise = 0.012
        contrast = 1.05
        brightness = 1.0
        vibrancy = 0.22
        vibrancy_darkness = 0.1
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        offset = 0 6
        color = rgba(0b0b12b3)
        color_inactive = rgba(0b0b1266)
    }
}

### animations
animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    bezier = snap,   0.3, 0, 0.1, 1
    bezier = overshoot, 0.2, 1.1, 0.2, 1

    animation = windowsIn,  1, 4, overshoot, popin 85%
    animation = windowsOut, 1, 4, snap, popin 85%
    animation = windowsMove,1, 4, smooth, slide
    animation = fade,       1, 5, smooth
    animation = border,     1, 8, smooth
    animation = borderangle,1, 60, smooth, loop
    animation = workspaces, 1, 5, smooth, slidefade 15%
    animation = layers,     1, 4, overshoot, popin 90%
}

dwindle {
    # pseudotile was removed upstream; the per-window `pseudo` dispatcher
    # (Super+P below) does the same job
    preserve_split = true
    smart_split = false
    split_width_multiplier = 1.0
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # vfr moved to debug: upstream and is on by default — dropped
    vrr = 1
    focus_on_activate = true
    animate_manual_resizes = true
    # new_window_takes_over_fullscreen no longer exists in this version
}

### rules
windowrule = suppressevent maximize, class:.*
windowrule = float, class:^(pavucontrol|nm-connection-editor|blueman-manager|org.pulseaudio.pavucontrol)$
windowrule = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float, title:^(Open File|Save As|Choose Files|Open Folder)(.*)$
windowrule = size 60% 60%, title:^(Open File|Save As|Choose Files)(.*)$
windowrule = opacity 0.94 0.90, class:^(kitty|Alacritty|org.gnome.Nautilus|thunar|Thunar|nemo)$
windowrule = opacity 1.0 1.0, class:^(firefox|google-chrome|chromium-browser|mpv|vlc|steam)$
windowrule = noblur, class:^(firefox|google-chrome|mpv)$
windowrule = idleinhibit fullscreen, class:.*
windowrule = fullscreen, class:^(steam_app).*

layerrule = blur, waybar
layerrule = ignorealpha 0.1, waybar
layerrule = blur, wofi
layerrule = ignorealpha 0.3, wofi
layerrule = blur, notifications
layerrule = ignorealpha 0.1, notifications

### keybinds
bind = $mod, Return, exec, $term
bind = $mod, D, exec, $menu
bind = $mod, E, exec, $files
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exec, $power
bind = $mod, L, exec, hyprlock
bind = $mod, V, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, J, layoutmsg, togglesplit   # bare togglesplit dispatcher was removed
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1
bind = $mod, T, exec, hyprctl keyword general:layout "$(hyprctl getoption general:layout -j | grep -q dwindle && echo master || echo dwindle)"
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod, Y, exec, hyprpicker -a
bind = $mod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# screenshots
bind = , Print, exec, $shot
bind = $mod, Print, exec, grim "$HOME/Pictures/Screenshots/$(date +%F_%H-%M-%S).png"

# focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, K, movefocus, u
bind = $mod ALT, J, movefocus, d
bind = $mod ALT, K, movefocus, u

# move windows
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# resize
binde = $mod CTRL, left,  resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up,    resizeactive, 0 -40
binde = $mod CTRL, down,  resizeactive, 0 40

# workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1
bind = $mod, Tab, cyclenext,
bind = $mod SHIFT, Tab, cyclenext, prev

# mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# media / hardware keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioPlay, exec, playerctl play-pause
